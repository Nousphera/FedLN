name: Build and Run

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytorch-flower:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install torch==2.8.0 torchvision==0.23.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          python -m pip check
          python -m compileall -q src/fedln scripts
      - name: Prepare Real Data
        run: |
          python scripts/prepare_data.py --dataset fashionmnist
          python - <<'PY'
          from pathlib import Path
          import numpy as np
          from fedln.preparation import finish_manifest
          directory = Path('data/prepared/fashionmnist')
          for split, per_class in [('train', 40), ('test', 8)]:
              images = np.load(directory / f'{split}_images.npy')
              labels = np.load(directory / f'{split}_labels.npy')
              rows = np.sort(np.concatenate([np.flatnonzero(labels == k)[:per_class] for k in range(10)]))
              np.save(directory / f'{split}_images.npy', images[rows])
              np.save(directory / f'{split}_labels.npy', labels[rows])
          finish_manifest(directory, 'fashionmnist', {'purpose': 'Bounded CI subset of official Fashion-MNIST'})
          PY
          python scripts/prepare_model.py --dataset fashionmnist
      - name: Run Native Flower Methods
        env:
          FLWR_DISABLE_RUNTIME_DEPENDENCY_INSTALLATION: '1'
        run: |
          for method in nnc akd nafedavg fedavg label-smoothing bi-tempered confident-learning centralized; do
            python scripts/run_experiment.py --method "$method" \
              --dataset fashionmnist --nr-clients 2 --rounds 2 --participation 1 \
              --batch-size 32 --learning-rate .01 --neighbors 5 --noise-round 1 \
              --cleanlab-folds 2 --cleanlab-epochs 1 --device cpu
          done
          python - <<'PY'
          from pathlib import Path
          import json, math
          for path in Path('results').glob('*.json'):
              result = json.loads(path.read_text())
              assert len(result['rounds']) == 2
              assert all(math.isfinite(r['loss']) and 0 <= r['accuracy'] <= 1 for r in result['rounds'])
              assert path.with_suffix('.pt').is_file()
          assert len(list(Path('results').glob('*.json'))) == 8
          PY
      - name: Check Patch
        run: git diff-tree --check HEAD
