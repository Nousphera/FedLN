name: Maintenance checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install maintenance tools
        run: python -m pip install -r requirements.txt -r requirements-simulation.txt cffconvert==2.0.0 PyYAML==6.0.3
      - name: Validate citation metadata
        run: cffconvert --validate
      - name: Compile Python sources
        run: python -m compileall -q src tests
      - name: Run maintenance regression tests
        run: python -m pytest -q
      - name: Check whitespace
        run: git show --format= --check HEAD
      - name: Run actual native Flower smoke
        run: |
          timeout 240s flwr run .
          python scripts/check_run.py runs/flower-smoke --rounds 2
