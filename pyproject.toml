[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fedln-research"
version = "0.1.0"
description = "Maintained FedLN research implementation"
requires-python = ">=3.11,<3.12"
dependencies = ["tensorflow==2.15.1", "flwr==1.13.1", "numpy==1.26.4", "scikit-learn==1.6.1", "cleanlab==2.7.1", "GPUtil==1.4.0", "click>=8.1,<8.2", "pytest==8.4.2"]

[tool.setuptools]
py-modules = ["run", "native_app", "native_transport", "server_app", "client_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.flwr.app]
publisher = "nousphera"

[tool.flwr.app.components]
serverapp = "server_app:app"
clientapp = "client_app:app"

[tool.flwr.app.config]
options = "--method nnc --dataset_name synthetic --num_clients 2 --num_rounds 2 --train_epochs 1 --batch_size 8 --knn_neighbors 5 --output runs/flower-smoke"

[tool.flwr.federations]
default = "local-simulation"

[tool.flwr.federations.local-simulation]
options.num-supernodes = 2
options.backend.client-resources.num-cpus = 1
options.backend.client-resources.num-gpus = 0.0
options.backend.init-args.num-cpus = 1

[tool.flwr.federations.paper]
options.num-supernodes = 30
options.backend.client-resources.num-cpus = 1
options.backend.client-resources.num-gpus = 0.0
options.backend.init-args.num-cpus = 1

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
namespaces = true

[tool.setuptools.package-data]
"src.data" = ["features/*.npy"]
